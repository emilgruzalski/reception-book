<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Przełącz menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">ReceptionBook</span>
  <span class="spacer"></span>
  <ng-container *ngIf="currentUser$ | async as user">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name" *ngIf="!isHandset">{{ user.firstName }} {{ user.lastName }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/account/change-password">
        <mat-icon>key</mat-icon>
        <span>Zmień hasło</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Wyloguj</span>
      </button>
    </mat-menu>
  </ng-container>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav class="sidenav" [mode]="isHandset ? 'over' : 'side'" [opened]="!isHandset">
    <mat-nav-list (click)="closeOnHandset(sidenav)">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Pulpit</span>
      </a>
      <a mat-list-item routerLink="/rooms" routerLinkActive="active-link">
        <mat-icon matListItemIcon>meeting_room</mat-icon>
        <span matListItemTitle>Pokoje</span>
      </a>
      <a mat-list-item routerLink="/guests" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Goście</span>
      </a>
      <a mat-list-item routerLink="/reservations" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Rezerwacje</span>
      </a>
      <a mat-list-item routerLink="/users" routerLinkActive="active-link" *appHasRole="administratorOnly">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>Użytkownicy</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
