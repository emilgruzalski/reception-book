<header class="header">
  <button mat-icon-button class="menu-button" *ngIf="isCompact" (click)="sidenav.toggle()" aria-label="Przełącz menu">
    <mat-icon>menu</mat-icon>
  </button>
  <a class="brand" routerLink="/dashboard">ReceptionBook</a>

  <nav class="nav" *ngIf="!isCompact" aria-label="Główna nawigacja">
    <ng-container *ngFor="let link of links">
      <a class="nav-link" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page"
         *appHasRole="link.roles">{{ link.label }}</a>
    </ng-container>
  </nav>

  <span class="spacer"></span>
  <ng-container *ngIf="currentUser$ | async as user">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button" aria-label="Konto">
      <mat-icon>account_circle</mat-icon>
      <span *ngIf="!isCompact">{{ user.firstName }} {{ user.lastName }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/account/change-password">
        <mat-icon>key</mat-icon>
        <span>Zmień hasło</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Wyloguj</span>
      </button>
    </mat-menu>
  </ng-container>
</header>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav class="sidenav" mode="over">
    <mat-nav-list (click)="sidenav.close()" *ngIf="isCompact">
      <ng-container *ngFor="let link of links">
        <a mat-list-item [routerLink]="link.path" routerLinkActive="active-link" *appHasRole="link.roles">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
