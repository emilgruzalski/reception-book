<div class="page-header">
  <h1>Zmiana hasła</h1>
</div>

<mat-card class="password-card">
  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Obecne hasło</mat-label>
        <input matInput type="password" formControlName="currentPassword" autocomplete="current-password" required>
        <mat-error>Podaj obecne hasło.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nowe hasło</mat-label>
        <input matInput type="password" formControlName="newPassword" autocomplete="new-password" required>
        <mat-hint>Min. {{ passwordMinLength }} znaków, wielka i mała litera, cyfra oraz znak specjalny.</mat-hint>
        <mat-error>Hasło nie spełnia wymagań bezpieczeństwa.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Powtórz nowe hasło</mat-label>
        <input matInput type="password" formControlName="confirmNewPassword" autocomplete="new-password" required>
        <mat-error>Powtórz nowe hasło.</mat-error>
      </mat-form-field>

      <p class="error-message" *ngIf="form.hasError('fieldsMismatch') && form.controls.confirmNewPassword.touched">
        Hasła nie są identyczne.
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">Zmień hasło</button>
    </mat-card-actions>
  </form>
</mat-card>
