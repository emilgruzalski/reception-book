<div class="page-header">
  <h1>Goście</h1>
  <button mat-flat-button color="primary" (click)="openGuestDialog()">
    <mat-icon>person_add</mat-icon>
    Dodaj gościa
  </button>
</div>

<div class="filters">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Szukaj gościa</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Nazwisko, dokument, e-mail lub telefon">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

<div class="table-container mat-elevation-z2">
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="guests">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Imię i nazwisko</th>
      <td mat-cell *matCellDef="let guest">{{ guest.lastName }} {{ guest.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="documentNumber">
      <th mat-header-cell *matHeaderCellDef>Dokument</th>
      <td mat-cell *matCellDef="let guest">{{ guest.documentNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>E-mail</th>
      <td mat-cell *matCellDef="let guest">{{ guest.email || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
      <th mat-header-cell *matHeaderCellDef>Telefon</th>
      <td mat-cell *matCellDef="let guest">{{ guest.phoneNumber || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Dodany</th>
      <td mat-cell *matCellDef="let guest">{{ guest.createdAt | date:'dd.MM.yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let guest" class="actions-cell">
        <button mat-icon-button matTooltip="Edytuj" (click)="openGuestDialog(guest)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Usuń" (click)="deleteGuest(guest)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Brak gości do wyświetlenia.</td>
    </tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageIndex]="query.pageNumber - 1"
    [pageSize]="query.pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
