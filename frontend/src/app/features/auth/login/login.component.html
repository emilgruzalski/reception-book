<div class="login-page">
  <div class="cover">
    <p class="name">ReceptionBook</p>
    <p class="description">Grafik pokoi, rezerwacje i goście recepcji w jednym miejscu.</p>
  </div>

  <main class="panel">
    <form class="login-form" [formGroup]="form" (ngSubmit)="login()">
      <h1>Zaloguj się</h1>

      <mat-form-field appearance="outline">
        <mat-label>Nazwa użytkownika</mat-label>
        <input matInput formControlName="userName" autocomplete="username" required>
        <mat-error>Podaj nazwę użytkownika.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Hasło</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
               autocomplete="current-password" required>
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
                [attr.aria-label]="hidePassword ? 'Pokaż hasło' : 'Ukryj hasło'">
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>Podaj hasło.</mat-error>
      </mat-form-field>

      <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" type="submit" class="submit" [disabled]="isSubmitting">
        Zaloguj
      </button>
    </form>
  </main>
</div>
