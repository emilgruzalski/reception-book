<div class="page-header">
  <h1>Pokoje</h1>
  <button mat-flat-button color="primary" (click)="openRoomDialog()">
    <mat-icon>add</mat-icon>
    Dodaj pokój
  </button>
</div>

<div class="table-container mat-elevation-z2">
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="rooms">
    <ng-container matColumnDef="number">
      <th mat-header-cell *matHeaderCellDef>Numer</th>
      <td mat-cell *matCellDef="let room">{{ room.number }}</td>
    </ng-container>

    <ng-container matColumnDef="floor">
      <th mat-header-cell *matHeaderCellDef>Piętro</th>
      <td mat-cell *matCellDef="let room">{{ room.floor }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Typ</th>
      <td mat-cell *matCellDef="let room">{{ room.type | roomType }}</td>
    </ng-container>

    <ng-container matColumnDef="capacity">
      <th mat-header-cell *matHeaderCellDef>Liczba osób</th>
      <td mat-cell *matCellDef="let room">{{ room.capacity }}</td>
    </ng-container>

    <ng-container matColumnDef="pricePerNight">
      <th mat-header-cell *matHeaderCellDef>Cena za noc</th>
      <td mat-cell *matCellDef="let room">{{ room.pricePerNight | currency:'PLN' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let room">
        <span class="status status-{{ room.status | lowercase }}">{{ room.status | roomStatus }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let room" class="actions-cell">
        <button mat-icon-button matTooltip="Edytuj" (click)="openRoomDialog(room)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Brak pokoi do wyświetlenia.</td>
    </tr>
  </table>
</div>
